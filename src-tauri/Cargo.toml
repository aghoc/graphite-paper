[package]
name = "graphite-paper"
version = "0.1.0"
description = "Graphite 디자인의 논문 리더"
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
name = "graphite_paper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: 로컬 이미지를 asset:// 프로토콜로 웹뷰에 노출
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GFM(표·체크리스트·취소선·각주·자동 링크) + 수식($, $$) 파싱. syntect 등 무거운 기본 기능은 끔
comrak = { version = "1", default-features = false }
notify = "8"
urlencoding = "2"

# 논문 읽기 (src/paper, OpenPaper에서 가져옴)
base64 = "0.22"
pdf-extract = "0.10"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
roxmltree = "0.21"
scraper = "0.24"
sha2 = "0.10"
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# `npm run dev`(디버그 빌드)에서도 PDF를 빨리 읽도록 의존 crate(pdf-extract·lopdf 등)는 최적화해서 빌드한다.
# 디버그로 두면 논문 한 편에 1.7초, 최적화하면 0.2초 안팎이다. 앱 코드는 디버그 그대로라 다시 빌드는 빠르다.
[profile.dev.package."*"]
opt-level = 3
