<!doctype html>
<html lang="ko" class="no-anim">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graphite Paper</title>
  <link rel="stylesheet" href="vendor/pretendard/pretendard.css" />
  <!-- 토스페이스: 문서 본문의 이모지에만 쓴다 (main.js가 이모지를 span.emoji로 감싼다) -->
  <link rel="stylesheet" href="vendor/tossface/tossface.css" />
  <!-- 디자인 토큰과 기본 부품 (앱 전용 규칙은 style.css에) -->
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- 피클 스타일 테마 (토큰·부품 모양 덮어쓰기) -->
  <link rel="stylesheet" href="theme.css" />
  <script src="main.js" defer></script>
</head>
<body>
  <div id="app" class="no-doc">
    <!-- 상단 바 (문서 모드 .t-dcnav, 60px) -->
    <nav class="t-dcnav topbar" aria-label="도구 모음">
      <button id="btn-toc" class="t-iconbtn t-iconbtn--sm" type="button" title="사이드바 (⌘\)" aria-label="사이드바 접기/펼치기">
        <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <span class="t-logo app-logo"><img src="logo.png" alt="" width="22" height="22" />Graphite Paper</span>
      <div class="doc-title">
        <span class="doc-sep" aria-hidden="true">/</span>
        <span id="doc-name" class="doc-name"></span>
        <span id="dirty-badge" class="t-badge t-badge--blue dirty-badge">수정됨</span>
      </div>

      <div class="topbar-right">
        <div id="mode-seg" class="t-seg t-seg--md mode-seg" role="tablist" aria-label="보기 모드">
          <button id="seg-view" type="button" role="tab" aria-selected="true">보기</button>
          <button id="seg-edit" type="button" role="tab" aria-selected="false">편집</button>
        </div>
        <button id="btn-save" class="t-btn t-btn--sm t-btn--primary save-btn" type="button">저장</button>
        <button id="btn-search" class="t-box t-box--sm search-trigger" type="button" aria-label="문서에서 찾기">
          <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="search-trigger__label">찾기</span>
          <kbd class="kbd" data-mod>F</kbd>
        </button>
        <div class="font-ctl">
          <button id="btn-font" class="t-iconbtn t-iconbtn--sm" type="button" title="글자 크기" aria-label="글자 크기" aria-haspopup="dialog" aria-expanded="false" aria-controls="font-pop">
            <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19 8.5 5h1L15 19M5 14.5h7"/><path d="M15.5 19l3-8h1l3 8M16.4 16.5h5.2"/></svg>
          </button>
          <div id="font-pop" class="t-popover font-pop" role="dialog" aria-label="글자 크기" hidden>
            <div class="font-pop__head">
              <strong>글자 크기</strong>
              <span id="font-value" class="font-pop__value"></span>
            </div>
            <div class="font-pop__row">
              <button id="font-dec" class="t-iconbtn t-iconbtn--sm t-iconbtn--fill" type="button" title="작게 (⌘−)" aria-label="글자 작게">
                <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
              </button>
              <input id="font-range" class="font-range" type="range" min="11" max="30" step="1" aria-label="글자 크기" />
              <button id="font-inc" class="t-iconbtn t-iconbtn--sm t-iconbtn--fill" type="button" title="크게 (⌘+)" aria-label="글자 크게">
                <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
            <button id="font-reset" class="t-btn t-btn--sm t-btn--grey font-pop__reset" type="button">기본 크기로 <kbd class="kbd" data-mod>0</kbd></button>
          </div>
        </div>
        <button id="btn-open" class="t-iconbtn t-iconbtn--sm" type="button" title="파일 열기 (⌘O)" aria-label="파일 열기">
          <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </button>
      </div>
    </nav>

    <!-- 사이드바 (문서 모드 .t-side, 236px): 파일 탐색기 / 목차 -->
    <aside id="toc" class="t-side toc" aria-label="사이드바">
      <div id="side-tabs" class="t-seg t-seg--sm side-tabs" role="tablist" aria-label="사이드바 보기">
        <button id="tab-files" type="button" role="tab" aria-selected="false" aria-controls="pane-files">파일</button>
        <button id="tab-toc" type="button" role="tab" aria-selected="true" aria-controls="pane-toc">목차</button>
      </div>

      <section id="pane-files" class="side-pane files" role="tabpanel" aria-labelledby="tab-files">
        <div class="files-head">
          <span id="files-root" class="files-root"></span>
          <button id="btn-new-file" class="t-iconbtn t-iconbtn--sm" type="button" title="새 마크다운 파일 (⌘N)" aria-label="새 마크다운 파일">
            <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg>
          </button>
          <button id="btn-refresh" class="t-iconbtn t-iconbtn--sm" type="button" title="새로 고침" aria-label="파일 목록 새로 고침">
            <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
          </button>
          <button id="btn-folder" class="t-iconbtn t-iconbtn--sm" type="button" title="다른 폴더 열기 (⇧⌘O)" aria-label="다른 폴더 열기">
            <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </button>
        </div>
        <div id="files-tree" class="files-tree" role="tree" aria-label="파일"></div>
        <div class="files-empty">
          <p>폴더를 열면 안에 있는 마크다운 파일을 여기서 바로 열 수 있어요</p>
          <button id="btn-folder-empty" class="t-btn t-btn--sm t-btn--grey" type="button">폴더 열기</button>
        </div>
      </section>

      <section id="pane-toc" class="side-pane" role="tabpanel" aria-labelledby="tab-toc">
        <nav id="toc-list" class="t-side__group toc-list" aria-label="목차"></nav>
        <p class="toc-empty">제목이 없는 문서예요</p>
      </section>
    </aside>
    <div id="toc-scrim" class="toc-scrim"></div>

    <main class="main">
      <!-- 빈 화면 -->
      <section id="empty" class="empty">
        <div class="empty__inner">
          <img class="empty__logo" src="logo.png" alt="Graphite Paper" width="72" height="72" />
          <h1 class="empty__title">마크다운 파일을<br />끌어다 놓으세요</h1>
          <p class="empty__sub">파일이나 폴더를 직접 골라서 열 수도 있어요</p>
          <div class="empty__ctas">
            <button id="btn-open-empty" class="t-btn t-btn--lg t-btn--primary empty__cta" type="button">파일 열기</button>
            <button id="btn-folder-empty2" class="t-btn t-btn--lg t-btn--grey empty__cta" type="button">폴더 열기</button>
          </div>
          <dl class="shortcuts">
            <div><dt>파일 열기</dt><dd><kbd class="kbd" data-mod>O</kbd></dd></div>
            <div><dt>보기 ↔ 편집</dt><dd><kbd class="kbd" data-mod>E</kbd></dd></div>
            <div><dt>저장</dt><dd><kbd class="kbd" data-mod>S</kbd></dd></div>
            <div><dt>찾기</dt><dd><kbd class="kbd" data-mod>F</kbd></dd></div>
            <div><dt>새 파일</dt><dd><kbd class="kbd" data-mod>N</kbd></dd></div>
            <div><dt>폴더 열기</dt><dd><kbd class="kbd" data-mod>⇧O</kbd></dd></div>
            <div><dt>사이드바</dt><dd><kbd class="kbd" data-mod>\</kbd></dd></div>
            <div><dt>글자 크기</dt><dd><kbd class="kbd" data-mod>+ − 0</kbd></dd></div>
          </dl>
        </div>
      </section>

      <!-- 뷰어 -->
      <section id="viewer" class="viewer" tabindex="-1">
        <div class="doc-wrap">
          <nav id="crumbs" class="t-crumbs crumbs" aria-label="파일 위치"></nav>
          <article id="content" class="t-doc markdown-body"></article>
        </div>
      </section>

      <!-- 뷰어와 편집기 사이 크기 조절 막대 -->
      <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="편집 창 너비 조절" tabindex="0"></div>

      <!-- 편집기 (뷰어 오른쪽에 열림) -->
      <section id="editor-wrap" class="editor-wrap" aria-label="원문 편집">
        <div class="editor-col">
          <div class="editor-head">
            <span class="editor-title">원문 편집</span>
            <span class="editor-hint"><kbd class="kbd" data-mod>S</kbd> 저장</span>
            <button id="btn-edit-close" class="t-iconbtn t-iconbtn--sm" type="button" title="편집 창 닫기 (⌘E)" aria-label="편집 창 닫기">
              <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
          <textarea id="editor" class="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="마크다운 원문"></textarea>
        </div>
      </section>

      <!-- 찾기 -->
      <div id="search" class="search" role="search">
        <label class="t-box search__box">
          <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search-input" type="text" placeholder="문서에서 찾기" spellcheck="false" aria-label="찾을 내용" />
          <span id="search-count" class="search__count"></span>
        </label>
        <button id="search-prev" class="t-iconbtn t-iconbtn--sm" type="button" title="이전 (Shift+Enter)" aria-label="이전 결과">
          <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        </button>
        <button id="search-next" class="t-iconbtn t-iconbtn--sm" type="button" title="다음 (Enter)" aria-label="다음 결과">
          <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <button id="search-close" class="t-iconbtn t-iconbtn--sm" type="button" title="닫기 (Esc)" aria-label="찾기 닫기">
          <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <!-- 외부 변경 알림 (콜아웃 형태로 아래에 띄움) -->
      <div id="banner" class="t-callout t-callout--warn banner" role="alert">
        <span class="t-callout__icon"><svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5h0"/></svg></span>
        <div class="t-callout__body banner__body">
          <div class="banner__text"><strong>다른 곳에서 파일이 바뀌었어요</strong><span>편집 중인 내용은 그대로 두었어요.</span></div>
          <div class="banner__actions">
            <button id="banner-ignore" class="t-btn t-btn--sm" type="button">이대로 두기</button>
            <button id="banner-reload" class="t-btn t-btn--sm t-btn--grey" type="button">새로 불러오기</button>
          </div>
        </div>
      </div>
    </main>

    <div id="toast" class="t-toast" role="status" hidden></div>

    <!-- 드래그 앤 드롭 -->
    <div id="drop" class="drop"><div class="drop__inner">
      <svg class="t-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      놓으면 바로 열어요
    </div></div>
  </div>
</body>
</html>
